name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'base/**'
      - 'versions.yaml'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'base/**'
      - 'versions.yaml'
      - '.github/workflows/build.yml'

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract versions
        id: versions
        run: |
          PROJECT_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['project']['version'])")
          CC_PROXY_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['cc_proxy']['version'])")
          MULTICA_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['multica']['version'])")
          CODEX_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('versions.yaml'))['codex']['version'])")
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          echo "CC_PROXY_VERSION=$CC_PROXY_VERSION" >> $GITHUB_OUTPUT
          echo "MULTICA_VERSION=$MULTICA_VERSION" >> $GITHUB_OUTPUT
          echo "CODEX_VERSION=$CODEX_VERSION" >> $GITHUB_OUTPUT

      - name: Build amd64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/base:latest-amd64
            ghcr.io/${{ github.repository }}/base:${{ steps.versions.outputs.PROJECT_VERSION }}-amd64
          build-args: |
            CC_PROXY_VERSION=${{ steps.versions.outputs.CC_PROXY_VERSION }}
            MULTICA_VERSION=${{ steps.versions.outputs.MULTICA_VERSION }}
            CODEX_VERSION=${{ steps.versions.outputs.CODEX_VERSION }}

      - name: Build arm64
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./base/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}/base:latest-arm64
            ghcr.io/${{ github.repository }}/base:${{ steps.versions.outputs.PROJECT_VERSION }}-arm64
          build-args: |
            CC_PROXY_VERSION=${{ steps.versions.outputs.CC_PROXY_VERSION }}
            MULTICA_VERSION=${{ steps.versions.outputs.MULTICA_VERSION }}
            CODEX_VERSION=${{ steps.versions.outputs.CODEX_VERSION }}

      - name: Report image size
        if: github.event_name == 'push'
        run: |
          docker images --format "table={{.Repository}}:{{.Tag}}\t{{.Size}}" | grep codex-with-multica || true
